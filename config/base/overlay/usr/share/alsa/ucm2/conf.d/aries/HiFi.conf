# Xiaomi Mi 2 (aries), APQ8064 with WCD9310.
# All outputs share the stereo 48 kHz SLIMbus playback PCM.
# The rear speaker is driven single-ended through LINEOUT3 (left, RX5 chain)
# and LINEOUT1 (right, RX3 chain); the amp enable is a machine-driver GPIO.

SectionVerb {
	EnableSequence [
		cset "name='Speaker Switch' off"
		cset "name='Earpiece Switch' off"
		cset "name='Headphone Switch' off"
		cset "name='RX1 MIX1 INP1 Mux' ZERO"
		cset "name='RX2 MIX1 INP1 Mux' ZERO"
		cset "name='RX3 MIX1 INP1 Mux' ZERO"
		cset "name='RX5 MIX1 INP1 Mux' ZERO"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
		cset "name='Earpiece Switch' off"
		cset "name='Headphone Switch' off"
		cset "name='RX1 MIX1 INP1 Mux' ZERO"
		cset "name='RX2 MIX1 INP1 Mux' ZERO"
		cset "name='RX3 MIX1 INP1 Mux' ZERO"
		cset "name='RX5 MIX1 INP1 Mux' ZERO"
	]

	Value {
		TQ "HiFi"
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Speaker" {
	Comment "Rear speaker"
	ConflictingDevice [ "Headphones" "Earpiece" ]

	EnableSequence [
		cset "name='LINEOUT1 Volume' 12"
		cset "name='LINEOUT3 Volume' 12"
		cset "name='RX3 Digital Volume' 84"
		cset "name='RX5 Digital Volume' 84"
		# Keep the left and right SLIMbus channels apart.
		cset "name='RX5 MIX1 INP1 Mux' RX1"
		cset "name='RX3 MIX1 INP1 Mux' RX2"
		cset "name='Speaker Switch' on"
	]

	DisableSequence [
		cset "name='Speaker Switch' off"
		cset "name='RX5 MIX1 INP1 Mux' ZERO"
		cset "name='RX3 MIX1 INP1 Mux' ZERO"
	]

	Value {
		PlaybackPriority 200
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"
	ConflictingDevice [ "Speaker" "Earpiece" ]

	EnableSequence [
		cset "name='HPHL Volume' 6"
		cset "name='HPHR Volume' 6"
		cset "name='RX1 Digital Volume' 78"
		cset "name='RX2 Digital Volume' 78"
		cset "name='RX1 MIX1 INP1 Mux' RX1"
		cset "name='RX2 MIX1 INP1 Mux' RX2"
		cset "name='Headphone Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Switch' off"
		cset "name='RX1 MIX1 INP1 Mux' ZERO"
		cset "name='RX2 MIX1 INP1 Mux' ZERO"
	]

	Value {
		PlaybackPriority 300
		JackControl "Headphone Jack"
	}
}

SectionDevice."Earpiece" {
	Comment "Front earpiece"
	ConflictingDevice [ "Speaker" "Headphones" ]

	EnableSequence [
		cset "name='RX1 Digital Volume' 84"
		cset "name='RX1 MIX1 INP1 Mux' RX1"
		cset "name='Earpiece Switch' on"
	]

	DisableSequence [
		cset "name='Earpiece Switch' off"
		cset "name='RX1 MIX1 INP1 Mux' ZERO"
	]

	Value {
		PlaybackPriority 100
	}
}
